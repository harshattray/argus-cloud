    <text x="0" y="21" font-size="40" font-weight="700" letter-spacing="-1.5" textLength="115.4" lengthAdjust="spacing">norma</text>
    <text x="0" y="33" font-size="13" font-weight="400" letter-spacing="6.5" textLength="61.6" lengthAdjust="spacing">scope</text>
  </g>
  <text x="131.4" y="21" fill="#ffffff" fill-opacity=".9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="400" textLength="96" lengthAdjust="spacing">cloud</text>
