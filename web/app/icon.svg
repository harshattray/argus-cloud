<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Normascope">
  <title>Normascope</title>
  <!-- The brand is a wordmark, so the tile is the wordmark's own first letter,
       in its own face and weight — not a symbol. It used to be a cloud, which
       collided head-on with the paid tier being the one called Cloud.
       textLength pins the glyph's width so the tile is identical wherever the
       system grotesque resolves.

       This file is the source for favicon.ico and apple-icon.png beside it.
       Those are built, not drawn: change anything here and run
       `python3 scripts/build-favicons.py` or the raster icons keep the old
       tile while this one changes. -->
  <rect width="48" height="48" rx="12" fill="#a8736e"/>
  <text x="24" y="34.5" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" textLength="23" lengthAdjust="spacingAndGlyphs">n</text>
</svg>
